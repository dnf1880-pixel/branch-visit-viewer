<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>网点拜访登记系统</title>
<link rel="stylesheet" href="../src/assets/styles.css">
</head>
<body>

<!-- Header -->
<header style="
  position:sticky;top:0;z-index:100;
  background:linear-gradient(135deg,#12122A,#1A1A3A);
  border-bottom:1px solid var(--border);
  padding:12px 16px;
  display:flex;align-items:center;gap:8px;
">
  <h1 style="
    font-size:1.15rem;font-weight:700;
    background:linear-gradient(135deg,var(--purple),var(--pink));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  ">网点拜访登记系统</h1>
  <span style="font-size:.75rem;color:var(--text3);margin-left:auto;">骨架 v2.0</span>
</header>

<!-- Content Placeholder -->
<main style="padding:20px;max-width:560px;margin:0 auto;text-align:center;">
  <div style="
    background:var(--bg2);border:1px solid var(--border);
    border-radius:var(--radius);padding:40px 20px;margin-top:40px;
  ">
    <div style="font-size:3rem;margin-bottom:12px;">🏗️</div>
    <h2 style="font-size:1.1rem;color:var(--text);margin-bottom:8px;">最小可运行骨架已就绪</h2>
    <div style="font-size:.82rem;color:var(--text2);line-height:1.8;">
      <p>✅ IndexedDB 连接正常</p>
      <p>✅ 日志系统已激活（打开控制台查看）</p>
      <p>✅ Toast 组件已挂载</p>
      <p>✅ 错误码体系已注册</p>
      <p>✅ 环境变量已加载</p>
      <p style="margin-top:12px;color:var(--text3);">架构文档: <code style="color:var(--purple);">docs/ARCHITECTURE.md</code></p>
      <p style="color:var(--text3);">知识图谱: <code style="color:var(--purple);">docs/knowledge-map.html</code></p>
    </div>
  </div>
</main>

<script type="module" src="../src/main.js"></script>
</body>
</html>
