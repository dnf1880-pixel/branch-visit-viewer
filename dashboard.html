<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>待办跟进看板</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0D1A;--bg2:#151528;--bg3:#1C1C36;--bg4:#242445;
  --purple:#7B5CFF;--pink:#FF6B9D;--purple-dim:rgba(123,92,255,.15);--pink-dim:rgba(255,107,157,.15);
  --text:#E8E8F0;--text2:#9999B8;--text3:#666688;
  --border:#2A2A4A;--radius:10px;--radius-sm:6px;
  --font:PingFang SC,Microsoft YaHei,sans-serif;
  --green:#4CAF50;--green-dim:rgba(76,175,80,.15);
  --orange:#FF9800;--orange-dim:rgba(255,152,0,.15);
}
html{font-size:14px}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
a{color:var(--purple);text-decoration:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Header */
.header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#12122A 0%,#1A1A3A 100%);border-bottom:1px solid var(--border);padding:12px 16px;backdrop-filter:blur(10px)}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.header h1{font-size:1.15rem;font-weight:700;background:linear-gradient(135deg,var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.back-btn{display:inline-flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 12px;font-size:.82rem;font-weight:500;color:var(--text2);cursor:pointer;transition:all .2s;text-decoration:none;white-space:nowrap}
.back-btn:hover{border-color:var(--purple);color:var(--purple)}
.back-btn svg{width:14px;height:14px;fill:currentColor}
.last-update{font-size:.72rem;color:var(--text3);display:flex;align-items:center;gap:6px}
.refresh-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);cursor:pointer;transition:all .2s;flex-shrink:0}
.refresh-btn:hover{border-color:var(--purple);background:var(--purple-dim)}
.refresh-btn svg{width:11px;height:11px;fill:var(--text2);transition:fill .2s}
.refresh-btn:hover svg{fill:var(--purple)}

/* Container */
.container{padding:12px 16px 40px}

/* Section title */
.section-title{font-size:.9rem;font-weight:700;color:var(--text);margin:20px 0 10px;padding-left:10px;border-left:3px solid var(--purple)}
.section-title:first-child{margin-top:0}

/* Metric cards */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
@media(max-width:480px){.metrics{gap:8px}}
.metric-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;text-align:center}
.metric-card .m-label{font-size:.72rem;color:var(--text2);margin-bottom:6px}
.metric-card .m-value{font-size:1.6rem;font-weight:800}
.metric-card .m-value.c-purple{color:var(--purple)}
.metric-card .m-value.c-pink{color:var(--pink)}
.metric-card .m-value.c-green{color:var(--green)}
.metric-card .m-value.c-orange{color:var(--orange)}

/* Coverage - 2-col fixed layout */
.coverage-wrapper{display:flex;gap:8px;flex-direction:column}
@media(min-width:500px){.coverage-wrapper{flex-direction:row}}
.coverage-col{flex:1;display:flex;flex-direction:column;gap:8px}
.city-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px}
.city-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.city-card-title{font-weight:700;font-size:.8rem;color:var(--text);display:flex;align-items:center;gap:5px}
.city-card-title .cd{width:6px;height:6px;border-radius:50%;background:var(--purple);flex-shrink:0}
.city-card-stat{font-size:.65rem;color:var(--text3)}
.city-card-table{display:table;width:100%;border-collapse:collapse}
.city-card-row{display:table-row}
.city-card-cell{display:table-cell;padding:3px 0;font-size:.72rem;color:var(--text2);vertical-align:middle}
.city-card-cell.name{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;width:100%}
.city-card-cell.count{text-align:right;padding-left:12px;font-weight:700;color:var(--purple);white-space:nowrap;width:1%}

/* Todo filter bar */
.todo-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.todo-filter .f-btn{padding:5px 10px;border-radius:14px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:.76rem;cursor:pointer;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.todo-filter .f-btn:hover{border-color:var(--purple);color:var(--purple)}
.todo-filter .f-btn.active{background:var(--purple-dim);border-color:var(--purple);color:var(--purple)}
.todo-filter .sort-arrow{font-size:.6rem;transition:transform .2s;display:inline-block}
.todo-filter .sort-arrow.asc{transform:rotate(180deg)}
.todo-filter select{background:var(--bg2);border:1px solid var(--border);border-radius:14px;color:var(--text);padding:5px 10px;font-size:.76rem;cursor:pointer;min-width:80px;max-width:130px}
.todo-filter select:focus{border-color:var(--purple);outline:none}
.todo-filter .sep{width:1px;height:16px;background:var(--border);margin:0 2px;flex-shrink:0}
.todo-filter .btn-ico{width:28px;height:28px;border-radius:var(--radius-sm);background:var(--bg3);display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);transition:all .2s;flex-shrink:0}
.todo-filter .btn-ico:hover{border-color:var(--purple);background:var(--purple-dim)}
.todo-filter .btn-ico svg{width:13px;height:13px;fill:var(--text2)}

/* Todo list - card style for mobile */
.todo-list{display:flex;flex-direction:column;gap:8px}
.todo-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;transition:border-color .15s}
.todo-card:hover{border-color:var(--purple)}
.todo-card.done{opacity:.55}

.todo-card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.todo-card-info{display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--text2);min-width:0}
.todo-card-date{white-space:nowrap}
.todo-card-branch{color:var(--purple);font-weight:600;white-space:nowrap}
.todo-card-branch::before{content:"· ";color:var(--text3)}
.status-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.7rem;font-weight:600;cursor:pointer;transition:all .15s;user-select:none;flex-shrink:0}
.status-badge.progress{background:var(--orange-dim);color:var(--orange)}
.status-badge.done{background:var(--green-dim);color:var(--green)}
.status-badge:hover{opacity:.75}

.todo-card-task{font-size:.85rem;color:var(--text);line-height:1.5;cursor:text;padding:4px 0;border-bottom:1px solid transparent;transition:border-color .15s}
.todo-card-task:focus{border-bottom-color:var(--purple);outline:none}
.todo-card-task::before{content:"任务：";font-size:.72rem;color:var(--text3)}
.todo-card-task:empty::after{content:"点击编辑";color:var(--text3);font-size:.78rem}

.todo-card-remark{font-size:.78rem;color:var(--text2);line-height:1.4;cursor:text;padding:4px 0;margin-top:4px;border-bottom:1px solid transparent;transition:border-color .15s}
.todo-card-remark:focus{border-bottom-color:var(--purple);outline:none;color:var(--text)}
.todo-card-remark::before{content:"备注：";font-size:.72rem;color:var(--text3)}
.todo-card-remark:empty::after{content:"点击添加备注";color:var(--text3);font-size:.72rem;font-style:italic}

/* Empty */
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state svg{width:48px;height:48px;fill:var(--border);margin-bottom:12px}
.empty-state p{font-size:.85rem;color:var(--text2)}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--bg3);border:1px solid var(--purple);color:var(--text);padding:10px 20px;border-radius:var(--radius);font-size:.85rem;z-index:300;transition:transform .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.error{border-color:var(--pink)}
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <a class="back-btn" href="index.html">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      返回主界面
    </a>
    <h1>📊 待办跟进看板</h1>
    <span class="last-update">
      <span id="updateTime"></span>
      <button class="refresh-btn" title="刷新数据" onclick="location.reload()">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </span>
  </div>
</div>

<div class="container">

  <!-- ========== 拜访模块 ========== -->
  <div class="section-title">📍 拜访总览</div>
  <div class="metrics">
    <div class="metric-card">
      <div class="m-label">累计拜访</div>
      <div class="m-value c-purple" id="totalVisits">-</div>
    </div>
    <div class="metric-card">
      <div class="m-label">本月拜访</div>
      <div class="m-value c-pink" id="monthVisits">-</div>
    </div>
    <div class="metric-card">
      <div class="m-label">本周拜访</div>
      <div class="m-value c-green" id="weekVisits">-</div>
    </div>
  </div>

  <div class="section-title">🏙️ 拜访覆盖</div>
  <div class="coverage-wrapper" id="coverageList"></div>

  <!-- ========== 待办模块 ========== -->
  <div class="section-title" style="margin-top:20px">✅ 待办总览</div>
  <div class="metrics">
    <div class="metric-card">
      <div class="m-label">待办总数</div>
      <div class="m-value c-purple" id="todoTotal">-</div>
    </div>
    <div class="metric-card">
      <div class="m-label">跟进中</div>
      <div class="m-value c-orange" id="todoProgress">-</div>
    </div>
    <div class="metric-card">
      <div class="m-label">已完结</div>
      <div class="m-value c-green" id="todoDone">-</div>
    </div>
  </div>

  <div class="section-title">📋 待办明细</div>
  <div class="todo-filter">
    <button class="f-btn active" id="sortBtn" onclick="toggleSort()">日期 <span class="sort-arrow">▼</span></button>
    <select id="filterCity" onchange="applyFilters()">
      <option value="all">全部城市</option>
    </select>
    <select id="filterBranch" onchange="applyFilters()">
      <option value="all">全部网点</option>
    </select>
    <select id="filterStatus" onchange="applyFilters()">
      <option value="all">全部状态</option>
      <option value="progress">跟进中</option>
      <option value="done">已完结</option>
    </select>
    <span class="sep"></span>
  </div>
  <div id="todoDetail"></div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   DB
   ============================================================ */
const DB_NAME = "VisitRecordDB";
const DB_VERSION = 3;
let db = null;
let allRecords = [];
let currentSort = "new"; // "new" or "old"

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (e.oldVersion < 1) {
        database.createObjectStore("records", { keyPath: "id" });
      }
      if (e.oldVersion < 2 && !database.objectStoreNames.contains("branch_configs")) {
        database.createObjectStore("branch_configs", { keyPath: "branchKey" });
      }
      if (e.oldVersion < 3 && !database.objectStoreNames.contains("branch_configs")) {
        database.createObjectStore("branch_configs", { keyPath: "branchKey" });
      }
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}

function getAllRecords() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction("records", "readonly");
    const store = tx.objectStore("records");
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

/* ============================================================
   Helpers
   ============================================================ */
function getMonday(d) {
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const m = new Date(d);
  m.setDate(diff);
  m.setHours(0,0,0,0);
  return m;
}

/* ============================================================
   Render (main)
   ============================================================ */
async function render() {
  try {
    await openDB();
    allRecords = await getAllRecords();
  } catch (e) {
    document.getElementById("updateTime").textContent = "数据库读取失败";
    return;
  }

  const now = new Date();
  const monday = getMonday(now);
  const mondayStr = monday.toISOString().split("T")[0];
  const monthStartStr = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-01";

  document.getElementById("updateTime").textContent =
    (now.getMonth()+1) + "月" + now.getDate() + "日 " +
    now.getHours().toString().padStart(2,"0") + ":" + now.getMinutes().toString().padStart(2,"0");

  // Visit stats
  let monthCount = 0, weekCount = 0;
  const cityMap = {};

  for (const r of allRecords) {
    const d = r.date;
    if (d >= monthStartStr) monthCount++;
    if (d >= mondayStr) weekCount++;

    const city = r.branchCity || "其他";
    if (!cityMap[city]) cityMap[city] = {};
    const bName = r.branchName || r.branch || "未知";
    cityMap[city][bName] = (cityMap[city][bName] || 0) + 1;
  }

  document.getElementById("totalVisits").textContent = allRecords.length;
  document.getElementById("monthVisits").textContent = monthCount;
  document.getElementById("weekVisits").textContent = weekCount;

  renderCoverage(cityMap);
  populateBranchFilter(cityMap);
  renderTodos();
}

/* ============================================================
   Coverage - 2-col fixed layout (左:荆州/恩施  右:宜昌/荆门/潜江)
   ============================================================ */
function renderCoverage(cityMap) {
  const container = document.getElementById("coverageList");
  if (Object.keys(cityMap).length === 0) {
    container.innerHTML = '<div class="empty-state" style="padding:24px"><p>暂无拜访数据</p></div>';
    return;
  }

  // Strip city prefix from branch names (e.g. "荆州市·荆州城区" → "荆州城区")
  function cleanName(city, name) {
    const prefixes = [city + "市·", city + "市", city + "·"];
    for (const p of prefixes) {
      if (name.startsWith(p)) return name.slice(p.length);
    }
    return name;
  }

  function renderCityCard(city) {
    const branches = cityMap[city];
    if (!branches) return "";
    const entries = Object.entries(branches).sort((a,b) => b[1]-a[1]);
    const totalInCity = entries.reduce((s,[,c]) => s+c, 0);
    let html = '<div class="city-card">';
    html += '<div class="city-card-head">';
    html += '<span class="city-card-title"><span class="cd"></span>' + city + '</span>';
    html += '<span class="city-card-stat">' + entries.length + '网点 ' + totalInCity + '次</span>';
    html += '</div>';
    html += '<div class="city-card-table">';
    for (const [name, count] of entries) {
      html += '<div class="city-card-row"><span class="city-card-cell name">' + cleanName(city, name)
           + '</span><span class="city-card-cell count">' + count + '次</span></div>';
    }
    html += '</div></div>';
    return html;
  }

  // Match stored city names (e.g. "荆州市") by prefix
  const leftPrefixes = ["荆州", "恩施"];
  const rightPrefixes = ["宜昌", "荆门", "潜江"];
  const allCities = Object.keys(cityMap).sort();
  const leftCities = [], rightCities = [];
  for (const c of allCities) {
    if (leftPrefixes.some(p => c.startsWith(p))) {
      leftCities.push(c);
    } else {
      rightCities.push(c);
    }
  }

  let leftHtml = "", rightHtml = "";
  for (const c of leftCities) leftHtml += renderCityCard(c);
  for (const c of rightCities) rightHtml += renderCityCard(c);

  container.innerHTML =
    '<div class="coverage-col">' + leftHtml + '</div>' +
    '<div class="coverage-col">' + rightHtml + '</div>';
}

/* ============================================================
   Branch filter
   ============================================================ */
function populateBranchFilter(cityMap) {
  const selBranch = document.getElementById("filterBranch");
  const selCity = document.getElementById("filterCity");

  // City filter
  let cityOpts = '<option value="all">全部城市</option>';
  for (const city of Object.keys(cityMap).sort()) {
    cityOpts += '<option value="' + city + '">' + city + '</option>';
  }
  selCity.innerHTML = cityOpts;

  // Branch filter
  const allBranches = [];
  for (const city of Object.keys(cityMap).sort()) {
    for (const bName of Object.keys(cityMap[city]).sort()) {
      allBranches.push({ city, name: bName });
    }
  }
  let opts = '<option value="all">全部网点</option>';
  for (const b of allBranches) {
    opts += '<option value="' + b.name + '">' + b.name + '</option>';
  }
  selBranch.innerHTML = opts;
}

/* ============================================================
   Sort & filter
   ============================================================ */
function toggleSort() {
  currentSort = currentSort === "new" ? "old" : "new";
  const btn = document.getElementById("sortBtn");
  const arrow = btn.querySelector(".sort-arrow");
  arrow.classList.toggle("asc", currentSort === "old");
  renderTodos();
}

function applyFilters() {
  renderTodos();
}

/* ============================================================
   Render Todos — reads from IndexedDB record fields
   ============================================================ */
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderTodos() {
  const cityFilter = document.getElementById("filterCity").value;
  const branchFilter = document.getElementById("filterBranch").value;
  const statusFilter = document.getElementById("filterStatus").value;

  // Build todo items from record.todoTask / todoStatus / todoRemark
  const todoItems = [];
  for (const r of allRecords) {
    const task = (r.todoTask || r.notes || "").trim();
    if (!task) continue;

    todoItems.push({
      key: r.id,
      recordId: r.id,
      date: r.date,
      branch: r.branchName || r.branch || "未知",
      city: r.branchCity || "其他",
      task,
      remark: r.todoRemark || "",
      status: r.todoStatus || "progress"
    });
  }

  // Sort
  if (currentSort === "new") {
    todoItems.sort((a,b) => b.date.localeCompare(a.date) || b.recordId.localeCompare(a.recordId));
  } else {
    todoItems.sort((a,b) => a.date.localeCompare(b.date) || a.recordId.localeCompare(b.recordId));
  }

  // Filter
  let filtered = todoItems;
  if (cityFilter !== "all") filtered = filtered.filter(t => t.city === cityFilter);
  if (branchFilter !== "all") filtered = filtered.filter(t => t.branch === branchFilter);
  if (statusFilter !== "all") filtered = filtered.filter(t => t.status === statusFilter);

  // Stats (on ALL items, not filtered)
  const total = todoItems.length;
  const done = todoItems.filter(t => t.status === "done").length;
  const progress = total - done;
  document.getElementById("todoTotal").textContent = total;
  document.getElementById("todoProgress").textContent = progress;
  document.getElementById("todoDone").textContent = done;

  const container = document.getElementById("todoDetail");
  if (total === 0) {
    container.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg><p>暂无待办事项</p><p style="font-size:.72rem">记录带有备注的拜访记录将自动生成待办</p></div>';
    return;
  }
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state" style="padding:24px"><p>当前筛选条件下无匹配待办</p></div>';
    return;
  }

  let html = '<div class="todo-list">';
  for (const item of filtered) {
    const isDone = item.status === "done";
    const badgeCls = isDone ? "done" : "progress";
    const badgeText = isDone ? "已完结" : "跟进中";
    html += '<div class="todo-card' + (isDone?' done':'') + '">';
    html += '<div class="todo-card-meta">';
    html += '<span class="todo-card-info"><span class="todo-card-date">' + item.date + '</span><span class="todo-card-branch">' + item.branch + '</span></span>';
    html += '<span class="status-badge ' + badgeCls + '" onclick="toggleStatus(\'' + item.key + '\')">' + badgeText + '</span>';
    html += '</div>';
    html += '<div class="todo-card-task" contenteditable="true" data-key="' + item.key + '" data-field="task" onblur="saveEdit(this)">' + escapeHtml(item.task) + '</div>';
    html += '<div class="todo-card-remark" contenteditable="true" data-key="' + item.key + '" data-field="remark" onblur="saveEdit(this)">' + (item.remark ? escapeHtml(item.remark) : '') + '</div>';
    html += '</div>';
  }
  html += '</div>';
  container.innerHTML = html;
}

/* ============================================================
   Update record in IndexedDB (used by toggleStatus / saveEdit)
   ============================================================ */
async function updateRecord(record) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction("records", "readwrite");
    const store = tx.objectStore("records");
    const req = store.put(record);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

/* ============================================================
   Toggle status — writes to IndexedDB
   ============================================================ */
async function toggleStatus(key) {
  const record = allRecords.find(r => r.id === key);
  if (!record) return;
  record.todoStatus = record.todoStatus === "done" ? "progress" : "done";
  record.todoUpdatedAt = new Date().toISOString();
  try {
    await updateRecord(record);
    renderTodos();
  } catch(e) {
    showToast("更新失败：" + e.message, true);
  }
}

/* ============================================================
   Save edit — writes to IndexedDB
   ============================================================ */
async function saveEdit(el) {
  const key = el.dataset.key;
  const field = el.dataset.field;
  const newVal = el.innerText.trim();

  const record = allRecords.find(r => r.id === key);
  if (!record) return;

  const now = new Date().toISOString();
  if (field === "task") {
    record.todoTask = newVal || (record.notes || "");
  } else if (field === "remark") {
    record.todoRemark = newVal;
  }
  record.todoUpdatedAt = now;

  try {
    await updateRecord(record);
    if (newVal && field === "task") showToast("已保存");
  } catch(e) {
    showToast("保存失败：" + e.message, true);
  }
}

/* ============================================================
   Toast
   ============================================================ */
let toastTimer;
function showToast(msg, isError) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (isError ? " error" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1500);
}

/* ============================================================
   Init
   ============================================================ */
render().catch(e => {
  document.getElementById("updateTime").textContent = "加载失败";
  console.error(e);
});
</script>
